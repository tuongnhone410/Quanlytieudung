name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Cài Gradle để tạo Gradle Wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # Tự tạo gradlew nếu project chưa có
      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Không tìm thấy gradlew -> đang tạo Gradle Wrapper..."
            gradle wrapper --gradle-version 8.10
          else
            echo "Đã có gradlew -> sử dụng gradlew hiện tại."
          fi

      # Cấp quyền chạy
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Kiểm tra wrapper
      - name: Check Gradle Wrapper
        run: ./gradlew --version

      # Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-manager-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk