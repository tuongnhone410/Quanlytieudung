name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare .env File
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper (Version 9.3.1)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      # Bước quan trọng: Ép Kotlin Compiler Daemon & KSP chạy in-process và Headless
      - name: Configure gradle.properties for KSP
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" >> gradle.properties
          echo "kotlin.daemon.jvm.options=-Djava.awt.headless=true" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quanlytieudung-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
