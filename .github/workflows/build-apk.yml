name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare .env File
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      # 1. Cài đặt màn hình ảo Xvfb cho Linux Runner
      - name: Install Xvfb (Virtual Display for KSP)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper (Version 9.3.1)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      # 2. Bọc lệnh build bằng xvfb-run để KSP không bị đứt luồng AWT
      - name: Build Debug APK
        run: |
          xvfb-run --auto-servernum ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quanlytieudung-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
