name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate debug.keystore
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Generate dummy google-services.json if missing
      run: |
        if [ ! -f app/google-services.json ]; then
          echo '{
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.expensetracker.wvxkqz"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildsOnly12345678"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  },
                  "appinvite_service": {
                    "status": 1,
                    "other_platform_oauth": []
                  },
                  "ads_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1 || true

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build Debug & Release APK
      run: |
        ./gradlew assembleDebug assembleRelease || gradle assembleDebug assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-debug-apks
        path: |
          app/build/outputs/apk/**/*.apk
